services:
  overmesh:
    build: https://github.com/Slofi/overmesh.git
    ports:
      - "8081:8081"
    volumes:
      - ./overmesh:/app/data
    environment:
      - OVERMESH_CONFIG=/app/data/config.json
      - OVERMESH_DATA_DIR=/app/data
      - OVERMESH_HOST=0.0.0.0
      - OVERMESH_PORT=8081
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    restart: unless-stopped
