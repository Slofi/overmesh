<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OM Lite</title>
  <link rel="stylesheet" href="/static/leaflet/leaflet.css">
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:      #e8b04f;
      --accent-dim:  #3a2a10;
      --bg:          #0d1117;
      --bg2:         #161b22;
      --bg3:         #21262d;
      --border:      #30363d;
      --text:        #c9d1d9;
      --text2:       #8b949e;
      --radius:      10px;
      --hdr:         44px;
      --side:        380px;
      --tab:         52px;
    }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
    }

    /* ── Header ── */
    #header {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--hdr);
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; padding: 0 14px;
      z-index: 1000;
    }
    .brand { font-weight: 700; font-size: 15px; color: var(--accent); letter-spacing: 1.5px; }
    .status-row { display: flex; align-items: center; gap: 5px; }
    .sdot { width: 9px; height: 9px; border-radius: 50%; background: var(--bg3); display: inline-block; flex-shrink: 0; }
    .sdot.ok   { background: #3fb950; box-shadow: 0 0 5px rgba(63,185,80,0.5); }
    .sdot.warn { background: #d29922; }
    .sdot.err  { background: #f85149; }
    .slabel { font-size: 11px; color: var(--text2); margin-right: 6px; }
    .hdr-space { flex: 1; }
    .hdr-link {
      font-size: 12px; color: var(--text2); text-decoration: none;
      padding: 5px 10px; border: 1px solid var(--border); border-radius: var(--radius);
    }
    .hdr-link:hover { color: var(--text); border-color: var(--accent); }

    /* ── Layout ── */
    #main {
      position: fixed; top: var(--hdr); left: 0; right: 0; bottom: 0;
      display: flex;
    }
    #map-pane { flex: 1; min-width: 0; }
    #map { width: 100%; height: 100%; }

    /* ── Side pane ── */
    #side-pane {
      width: var(--side); flex-shrink: 0;
      background: var(--bg);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
    }
    #panel-body { flex: 1; overflow: hidden; position: relative; }

    /* ── Panels ── */
    .panel { display: none; height: 100%; }
    .panel.active { display: block; overflow-y: auto; padding: 10px; }
    #panel-messages.active { display: flex; flex-direction: column; padding: 10px; gap: 8px; overflow: hidden; }

    /* ── Tab bar ── */
    #tab-bar {
      height: var(--tab); flex-shrink: 0;
      border-top: 1px solid var(--border);
      display: flex; background: var(--bg2);
    }
    .tab-btn {
      flex: 1; background: none; border: none; color: var(--text2);
      font-size: 11px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      padding: 0; transition: color 0.15s; border-top: 2px solid transparent;
    }
    .tab-icon { font-size: 17px; line-height: 1; }
    .tab-btn.active { color: var(--accent); border-top-color: var(--accent); }
    .tab-btn:hover { color: var(--text); }

    /* ── Contact rows ── */
    .contact-row {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 8px; border-bottom: 1px solid var(--border);
      cursor: pointer; border-radius: var(--radius);
    }
    .contact-row:hover { background: var(--bg2); }
    .net-badge {
      width: 28px; height: 18px; border-radius: 4px;
      font-size: 9px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .net-badge.mt { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); }
    .net-badge.mc { background: rgba(232,176,79,0.15); color: var(--accent); border: 1px solid rgba(232,176,79,0.3); }
    .cname { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cmeta { font-size: 11px; color: var(--text2); flex-shrink: 0; }

    /* ── Message rows ── */
    .msg-row {
      padding: 8px 10px;
      background: var(--bg2); border-radius: var(--radius);
      border-left: 3px solid var(--border);
    }
    .msg-row.sent { border-left-color: var(--accent); }
    .msg-row.mc   { border-left-color: #4ade80; }
    .msg-row.dm   { border-left-color: #d29922; }
    .msg-hdr {
      display: flex; justify-content: space-between;
      font-size: 11px; color: var(--text2); margin-bottom: 3px;
    }
    .msg-sender { font-weight: 600; color: var(--text); }
    .msg-text { font-size: 13px; word-break: break-word; white-space: pre-wrap; }

    /* ── Compose ── */
    .compose-wrap { display: flex; gap: 6px; flex-shrink: 0; }
    .compose-wrap input {
      flex: 1; padding: 9px 12px; min-height: 40px;
      background: var(--bg2); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px;
    }
    .compose-wrap input:focus { outline: none; border-color: var(--accent); }

    /* ── Selects ── */
    .ctrl-row { display: flex; gap: 6px; flex-shrink: 0; }
    .ctrl-row select, select.std {
      flex: 1; padding: 7px 10px;
      background: var(--bg2); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius); font-size: 12px;
    }
    .ctrl-row select:focus, select.std:focus { outline: none; border-color: var(--accent); }
    #msg-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }

    /* ── Log ── */
    .log-compose { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; margin-bottom: 10px; }
    .log-compose select,
    .log-compose textarea {
      width: 100%; margin-bottom: 8px; padding: 8px 10px;
      background: var(--bg3); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius);
      font-size: 13px; font-family: inherit;
    }
    .log-compose select:focus,
    .log-compose textarea:focus { outline: none; border-color: var(--accent); }
    .log-compose textarea { min-height: 64px; resize: vertical; }
    .log-row {
      padding: 8px 10px; margin-bottom: 6px;
      background: var(--bg2); border-radius: var(--radius);
      border-left: 3px solid var(--accent);
    }
    .log-hdr {
      display: flex; gap: 8px; align-items: center;
      font-size: 11px; color: var(--text2); margin-bottom: 4px;
    }
    .log-cat {
      font-weight: 700; color: var(--accent);
      background: var(--accent-dim); padding: 1px 6px; border-radius: 4px; font-size: 10px;
    }
    .log-body { font-size: 13px; word-break: break-word; white-space: pre-wrap; }

    /* ── Settings ── */
    .srow {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .slbl { font-size: 13px; }
    .ssub { font-size: 11px; color: var(--text2); margin-top: 2px; }

    /* ── Buttons ── */
    .btn {
      padding: 8px 14px; min-height: 38px;
      background: var(--accent); color: #0d1117;
      border: none; border-radius: var(--radius);
      cursor: pointer; font-size: 13px; font-weight: 700;
    }
    .btn:hover { opacity: 0.85; }
    .btn.sm { padding: 5px 12px; min-height: 30px; font-size: 12px; }
    .btn.muted { background: var(--bg3); color: var(--text); font-weight: 500; border: 1px solid var(--border); }
    .btn.muted:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Section header ── */
    .shdr {
      font-size: 11px; font-weight: 700; color: var(--text2);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin: 10px 0 6px; padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Overlays ── */
    .overlay {
      position: fixed; inset: 0; z-index: 2000;
      background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center;
    }
    .overlay.hidden { display: none; }

    .action-box {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px;
      min-width: 280px; max-width: 340px; width: 90%;
      position: relative;
    }
    .abox-title { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
    .abox-sub { font-size: 11px; color: var(--text2); margin-bottom: 12px; }
    .info-grid {
      display: grid; grid-template-columns: auto 1fr; gap: 4px 14px;
      font-size: 12px; margin-bottom: 14px;
      background: var(--bg3); border-radius: var(--radius); padding: 8px 10px;
    }
    .ig-key { color: var(--text2); }
    .ig-val { font-weight: 600; }
    .abox-btns { display: flex; flex-direction: column; gap: 8px; }
    .abox-btns .btn { width: 100%; text-align: left; }

    .dm-box {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px;
      width: 420px; max-width: 95vw;
      display: flex; flex-direction: column; gap: 10px;
      max-height: 520px; position: relative;
    }
    .dm-title { font-weight: 700; font-size: 14px; color: var(--accent); }
    .dm-history {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px;
      min-height: 80px; max-height: 300px;
    }
    .close-x {
      position: absolute; top: 12px; right: 14px;
      background: none; border: none; color: var(--text2);
      font-size: 18px; cursor: pointer; line-height: 1;
    }
    .close-x:hover { color: var(--text); }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 66px; left: 50%; transform: translateX(-50%);
      background: var(--bg3); color: var(--text); border: 1px solid var(--border);
      padding: 7px 20px; border-radius: 20px;
      font-size: 13px; z-index: 3000;
      opacity: 0; transition: opacity 0.2s; pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    /* ── Scrollbars ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text2); }

    /* ── Empty state ── */
    .empty { padding: 24px 16px; color: var(--text2); text-align: center; font-size: 13px; }

    /* ── Leaflet overrides ── */
    .leaflet-control-zoom a { background: var(--bg2) !important; color: var(--text) !important; border-color: var(--border) !important; }
    .leaflet-control-zoom a:hover { background: var(--bg3) !important; color: var(--accent) !important; }
    .leaflet-control-attribution { background: rgba(13,17,23,0.7) !important; color: var(--text2) !important; font-size: 10px !important; }
    .leaflet-control-attribution a { color: var(--text2) !important; }
    .leaflet-popup-content-wrapper { background: var(--bg2) !important; color: var(--text) !important; border: 1px solid var(--border) !important; border-radius: var(--radius) !important; box-shadow: 0 4px 16px rgba(0,0,0,0.5) !important; }
    .leaflet-popup-tip { background: var(--bg2) !important; }
  </style>
</head>
<body data-version="{{ version }}">

<header id="header">
  <span class="brand">OM·LITE</span>
  <div class="status-row">
    <span id="dot-mt" class="sdot" title="Meshtastic"></span>
    <span class="slabel">MT</span>
    <span id="dot-mc" class="sdot" title="MeshCore"></span>
    <span class="slabel">MC</span>
    <span id="dot-gps" class="sdot" title="GPS"></span>
    <span class="slabel">GPS</span>
  </div>
  <div class="hdr-space"></div>
  <a href="/" class="hdr-link">Full OM →</a>
</header>

<div id="main">
  <div id="map-pane"><div id="map"></div></div>
  <div id="side-pane">
    <div id="panel-body">
      <div id="panel-contacts" class="panel active"></div>
      <div id="panel-messages" class="panel"></div>
      <div id="panel-log" class="panel"></div>
      <div id="panel-settings" class="panel"></div>
    </div>
    <nav id="tab-bar">
      <button class="tab-btn active" data-tab="contacts">
        <span class="tab-icon">📡</span><span>Nodes</span>
      </button>
      <button class="tab-btn" data-tab="messages">
        <span class="tab-icon">💬</span><span>Msgs</span>
      </button>
      <button class="tab-btn" data-tab="log">
        <span class="tab-icon">📋</span><span>Log</span>
      </button>
      <button class="tab-btn" data-tab="settings">
        <span class="tab-icon">⚙</span><span>Set</span>
      </button>
    </nav>
  </div>
</div>

<!-- Action sheet overlay -->
<div id="action-overlay" class="overlay hidden">
  <div class="action-box">
    <button class="close-x" id="action-close">✕</button>
    <div id="action-title" class="abox-title"></div>
    <div id="action-sub" class="abox-sub"></div>
    <div id="action-info" class="info-grid"></div>
    <div id="action-btns" class="abox-btns"></div>
  </div>
</div>

<!-- DM overlay -->
<div id="dm-overlay" class="overlay hidden">
  <div class="dm-box">
    <button class="close-x" id="dm-close">✕</button>
    <div id="dm-title" class="dm-title">DM</div>
    <div id="dm-history" class="dm-history"></div>
    <div class="compose-wrap">
      <input id="dm-input" type="text" autocomplete="off" placeholder="Message…">
      <button class="btn" id="dm-send-btn">Send</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/static/leaflet/leaflet.js"></script>
<script src="/static/js/lite.js?v={{ version }}"></script>
</body>
</html>
