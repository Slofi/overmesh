<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OverMesh — Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="icon" type="image/png" href="/static/favicon.png?v=2">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: var(--bg1);
    }
    .login-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 32px 28px;
      width: 100%;
      max-width: 340px;
      box-sizing: border-box;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-logo img {
      height: 48px;
      opacity: 0.9;
    }
    .login-title {
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 20px;
    }
    .login-field {
      margin-bottom: 14px;
    }
    .login-field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .login-field input {
      width: 100%;
      box-sizing: border-box;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font-size: 14px;
      padding: 8px 10px;
      outline: none;
    }
    .login-field input:focus {
      border-color: var(--accent);
    }
    .login-btn {
      width: 100%;
      margin-top: 6px;
      padding: 9px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 5px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .login-btn:hover {
      opacity: 0.88;
    }
    .login-error {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.4);
      color: #f87171;
      border-radius: 5px;
      padding: 8px 10px;
      font-size: 13px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-logo">
      <img src="/static/overmesh.png" alt="OverMesh" onerror="this.style.display='none'">
    </div>
    <div class="login-title">OverMesh</div>
    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="{{ url_for('login') }}">
      <div class="login-field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="login-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn">Sign in</button>
    </form>
  </div>
</body>
</html>
