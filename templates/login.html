<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OverMesh — Login</title>
  <link rel="icon" type="image/png" href="/static/favicon.png?v=2">
  <style>
    :root {
      --accent: {{ accent_color }};
      --bg1: #0d0d0f;
      --bg2: #17181c;
      --bg3: #1e2025;
      --border: #2a2b30;
      --text: #e8e9ec;
      --muted: #6b6e7a;
      --red: #ef4444;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg1);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    #topo-layer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .scatter {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }
    .s-logo {
      position: absolute;
      background: var(--accent);
      -webkit-mask-image: url('/static/Overmesh_logo.png');
      mask-image: url('/static/Overmesh_logo.png');
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      aspect-ratio: 848 / 202;
    }

    .login-wrap {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 340px;
      padding: 16px;
    }
    .login-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 36px 28px 28px;
    }
    .login-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }
    .login-logo-img {
      height: 22px;
      background: var(--accent);
      -webkit-mask-image: url('/static/Overmesh_logo.png');
      mask-image: url('/static/Overmesh_logo.png');
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      aspect-ratio: 848 / 202;
    }
    .login-sub {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 26px;
    }
    .login-field { margin-bottom: 14px; }
    .login-field label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .login-field input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
      padding: 9px 11px;
      outline: none;
      transition: border-color 0.15s;
    }
    .login-field input:focus { border-color: var(--accent); }
    .login-btn {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: opacity 0.15s;
    }
    .login-btn:hover  { opacity: 0.85; }
    .login-btn:active { opacity: 0.70; }
    .login-error {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.35);
      color: #f87171;
      border-radius: 6px;
      padding: 9px 11px;
      font-size: 13px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>

  <!--
    Topographic contour map — Ljubljana terrain.

    Three hills form an E-W ridge:
      Rožnik / Šišenski hrib (394 m, 429 m) — left
      Grajski grič / Castle Hill (375 m)    — centre
      Golovec (413–450 m)                   — right (partial)

    City basin floor: ~298 m.  Barje marshes south: ~288 m.
    Contour interval: 20 m.  Index contours (thicker): 300, 400 m.

    Coordinate space: 1440 × 900 px, ~220 px per km.
    N (Sava valley) = top.  S (Barje) = bottom.
    Hills are in the upper half; flat basin fills the lower half.
  -->
  <svg id="topo-layer" viewBox="0 0 1440 900"
       preserveAspectRatio="xMidYMid slice"
       xmlns="http://www.w3.org/2000/svg">
    <defs>

      <!-- ═══════════════════════════════════════════════
           GRAJSKI GRIČ (Castle Hill) — centre, peak 375 m
           Compact steep hill, slightly elongated E-W.
           South face noticeably steeper (rocky cliff under castle).
           Centre ≈ (830, 435)
           ═══════════════════════════════════════════════ -->

      <!-- 300 m — base of hill, just above city floor 298 m -->
      <path id="g300"
        d="M 844,264
           C 912,260 988,318 1002,390
           C 1016,462 982,534 928,566
           C 874,598 800,596 748,558
           C 696,520 672,452 676,390
           C 680,328 752,260 844,264 Z"/>

      <!-- 320 m -->
      <path id="g320"
        d="M 840,302
           C 898,298 960,348 972,408
           C 984,468 958,524 912,550
           C 866,576 806,572 762,540
           C 718,508 700,454 706,402
           C 712,350 776,304 840,302 Z"/>

      <!-- 340 m -->
      <path id="g340"
        d="M 836,346
           C 880,342 928,382 936,424
           C 944,466 924,506 888,524
           C 852,542 808,534 776,508
           C 744,482 730,440 736,402
           C 742,364 794,348 836,346 Z"/>

      <!-- 360 m -->
      <path id="g360"
        d="M 834,384
           C 862,382 892,402 898,428
           C 904,454 890,478 864,490
           C 838,502 808,494 788,476
           C 768,458 760,428 766,406
           C 772,384 806,384 834,384 Z"/>

      <!-- 375 m — near peak, small irregular loop -->
      <path id="g375"
        d="M 834,412
           C 846,410 858,418 860,430
           C 862,442 854,454 842,456
           C 830,458 818,450 816,438
           C 814,426 822,414 834,412 Z"/>


      <!-- ═══════════════════════════════════════════════
           ROŽNIK / ŠIŠENSKI HRIB — left side, E-W ridge.
           Rožnik/Cankar vrh peak 394 m ≈ (310, 295)
           Šišenski hrib 429 m ≈ (85, 265) — mostly off-screen left.
           Ridge elongated E-W; east slopes steeper (drop into city).
           ═══════════════════════════════════════════════ -->

      <!-- 300 m — large outer loop, partly off-screen left -->
      <path id="r300"
        d="M -40,492
           C -20,432 26,372 88,328
           C 150,284 228,268 304,270
           C 380,272 448,296 492,336
           C 536,376 548,428 532,476
           C 516,524 474,554 422,562
           C 370,570 308,558 260,530
           C 212,502 160,480 106,472
           C 52,464 -20,492 -40,492 Z"/>

      <!-- 320 m -->
      <path id="r320"
        d="M -40,472
           C -22,416 20,360 80,320
           C 140,280 214,266 288,270
           C 362,274 428,300 468,340
           C 508,380 518,428 502,472
           C 486,516 448,542 400,548
           C 352,554 296,540 252,514
           C 208,488 162,464 110,456
           C 58,448 -20,468 -40,472 Z"/>

      <!-- 340 m -->
      <path id="r340"
        d="M -20,452
           C -4,400 34,350 88,316
           C 142,282 210,270 278,276
           C 346,282 406,308 442,348
           C 478,388 486,432 468,470
           C 450,508 416,530 372,534
           C 328,538 278,522 238,498
           C 198,474 158,450 112,442
           C 66,434 -4,444 -20,452 Z"/>

      <!-- 360 m -->
      <path id="r360"
        d="M 14,432
           C 28,386 62,344 110,316
           C 158,288 216,278 272,286
           C 328,294 378,322 408,362
           C 438,402 442,444 424,476
           C 406,508 374,526 334,528
           C 294,530 254,512 220,490
           C 186,468 154,444 116,436
           C 78,428 32,420 14,432 Z"/>

      <!-- 380 m -->
      <path id="r380"
        d="M 54,414
           C 66,374 96,340 138,318
           C 180,296 228,290 272,300
           C 316,310 354,336 374,370
           C 394,404 392,440 374,464
           C 356,488 326,500 292,498
           C 258,496 228,478 200,458
           C 172,438 146,416 116,410
           C 86,404 54,394 54,414 Z"/>

      <!-- 394 m — Rožnik / Cankar vrh peak, small loop -->
      <path id="r394"
        d="M 248,332
           C 268,318 296,316 318,328
           C 340,340 350,364 342,386
           C 334,408 310,420 286,416
           C 262,412 244,396 242,374
           C 240,352 228,346 248,332 Z"/>

      <!-- 429 m — Šišenski hrib inner peak, partially off-screen -->
      <path id="r429"
        d="M -30,298
           C -18,276 8,260 36,258
           C 64,256 90,268 102,288
           C 114,308 108,334 90,348
           C 72,362 46,362 26,350
           C 6,338 -10,322 -30,298 Z"/>


      <!-- ═══════════════════════════════════════════════
           GOLOVEC — right side, entering from right edge.
           Main peak 413 m, massif up to 450 m.
           Only lower slopes visible on-screen.
           ═══════════════════════════════════════════════ -->

      <!-- 300 m — outer arc entering from right -->
      <path id="golovec300"
        d="M 1460,580
           C 1420,548 1370,510 1340,462
           C 1310,414 1316,360 1354,328
           C 1392,296 1440,292 1460,295"/>

      <!-- 320 m -->
      <path id="golovec320"
        d="M 1460,536
           C 1432,510 1396,476 1376,434
           C 1356,392 1362,344 1396,316
           C 1430,288 1460,284 1460,285"/>

      <!-- 340 m -->
      <path id="golovec340"
        d="M 1460,492
           C 1444,470 1420,444 1408,412
           C 1396,380 1404,346 1432,326
           C 1448,316 1460,314 1460,315"/>

      <!-- 360 m (small arc) -->
      <path id="golovec360"
        d="M 1460,450
           C 1450,436 1440,416 1436,394
           C 1432,372 1440,352 1456,342
           C 1460,340 1460,340 1460,341"/>


      <!-- ═══════════════════════════════════════════════
           BASIN / BARJE transition — open curves in the
           lower half, shaped around hill bases.
           NOT horizontal waves — they dip into the saddles
           between hills and curve around the hill bases.
           ═══════════════════════════════════════════════ -->

      <!-- 300 m — basin-level open arc connecting hill bases -->
      <!-- Dips north (smaller y) near hill bases, south in saddles -->
      <path id="basin300"
        d="M -40,628
           C 40,616 100,594 160,566
           C 220,538 266,514 310,508
           C 354,502 400,516 448,530
           C 496,544 560,554 630,544
           C 700,534 760,516 808,504
           C 856,492 900,492 944,506
           C 988,520 1040,542 1110,548
           C 1180,554 1270,542 1350,530
           C 1400,522 1440,516 1460,514"/>

      <!-- 295 m — slightly lower, more open, barely above Barje -->
      <path id="basin295"
        d="M -40,718
           C 80,706 200,718 340,706
           C 480,694 600,706 740,694
           C 880,682 1020,694 1180,682
           C 1310,672 1400,676 1460,674"/>

      <!-- 290 m — near Barje floor (288 m), very gentle undulation -->
      <path id="basin290"
        d="M -40,804
           C 120,796 300,808 500,798
           C 700,788 900,800 1100,790
           C 1270,782 1390,786 1460,784"/>

    </defs>


    <!-- ── Barje / flat basin lines ──────────────────── -->
    <g fill="none" stroke="#080809" stroke-linecap="round" stroke-linejoin="round">
      <use href="#basin290" stroke-width="0.75" opacity="0.80"/>
      <use href="#basin295" stroke-width="0.75" opacity="0.85"/>
      <!-- 300 m index — slightly thicker where it transitions to hill bases -->
      <use href="#basin300" stroke-width="1.3"  opacity="0.90"/>
    </g>

    <!-- ── Golovec (right edge, open arcs) ──────────── -->
    <g fill="none" stroke="#080809" stroke-linecap="round">
      <use href="#golovec300" stroke-width="1.3"  opacity="0.90"/>
      <use href="#golovec320" stroke-width="0.85" opacity="0.85"/>
      <use href="#golovec340" stroke-width="0.85" opacity="0.85"/>
      <use href="#golovec360" stroke-width="0.85" opacity="0.80"/>
    </g>

    <!-- ── Rožnik / Šišenski hrib (left) ────────────── -->
    <g fill="none" stroke="#080809" stroke-linecap="round" stroke-linejoin="round">
      <use href="#r300"  stroke-width="1.3"  opacity="0.90"/>
      <use href="#r320"  stroke-width="0.85" opacity="0.88"/>
      <use href="#r340"  stroke-width="0.85" opacity="0.85"/>
      <use href="#r360"  stroke-width="0.85" opacity="0.83"/>
      <use href="#r380"  stroke-width="0.85" opacity="0.80"/>
      <use href="#r394"  stroke-width="0.80" opacity="0.78"/>
      <use href="#r429"  stroke-width="0.75" opacity="0.72"/>
    </g>

    <!-- ── Grajski grič / Castle Hill (centre) ──────── -->
    <g fill="none" stroke="#080809" stroke-linecap="round" stroke-linejoin="round">
      <use href="#g300"  stroke-width="1.3"  opacity="0.90"/>
      <use href="#g320"  stroke-width="0.85" opacity="0.88"/>
      <use href="#g340"  stroke-width="0.85" opacity="0.85"/>
      <use href="#g360"  stroke-width="0.85" opacity="0.82"/>
      <use href="#g375"  stroke-width="0.75" opacity="0.75"/>
    </g>


    <!-- ── Elevation labels ──────────────────────────── -->
    <!--
      paint-order trick: bg-coloured stroke behind the text
      "breaks" the contour line at the label, like a real topo map.
    -->
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
       font-size="9" font-weight="500"
       fill="#141416"
       stroke="#0d0d0f" stroke-width="5"
       paint-order="stroke"
       dominant-baseline="middle">

      <!-- Basin labels -->
      <text><textPath href="#basin290" startOffset="55%">290</textPath></text>
      <text><textPath href="#basin295" startOffset="28%">295</textPath></text>
      <text><textPath href="#basin295" startOffset="72%">295</textPath></text>
      <text><textPath href="#basin300" startOffset="15%">300</textPath></text>
      <text><textPath href="#basin300" startOffset="62%">300</textPath></text>

      <!-- Grajski grič labels -->
      <text><textPath href="#g300" startOffset="12%">300</textPath></text>
      <text><textPath href="#g320" startOffset="75%">320</textPath></text>
      <text><textPath href="#g340" startOffset="30%">340</textPath></text>
      <text><textPath href="#g360" startOffset="60%">360</textPath></text>

      <!-- Rožnik labels -->
      <text><textPath href="#r300" startOffset="82%">300</textPath></text>
      <text><textPath href="#r320" startOffset="68%">320</textPath></text>
      <text><textPath href="#r340" startOffset="55%">340</textPath></text>
      <text><textPath href="#r360" startOffset="78%">360</textPath></text>
      <text><textPath href="#r380" startOffset="65%">380</textPath></text>

      <!-- Peak spot heights -->
      <text text-anchor="middle" x="838" y="435" font-size="8">375</text>
      <text text-anchor="middle" x="290" y="375" font-size="8">394</text>

      <!-- Golovec label on arc -->
      <text><textPath href="#golovec320" startOffset="40%">320</textPath></text>
    </g>
  </svg>

  <!-- Scattered OverMesh logo marks (wordmark PNG only, no plain text) -->
  <div class="scatter" id="scatter"></div>

  <div class="login-wrap">
    <div class="login-box">
      <div class="login-logo"><div class="login-logo-img"></div></div>
      <div class="login-sub">mesh network dashboard</div>
      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}
      <form method="POST" action="{{ base_path }}/login">
        <div class="login-field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username"
                 autocomplete="username" autofocus required>
        </div>
        <div class="login-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password"
                 autocomplete="current-password" required>
        </div>
        <button type="submit" class="login-btn">Sign in</button>
      </form>
    </div>
  </div>

  <script>
  (function () {
    /* Only logo wordmarks — no plain text items */
    var logos = [
      { top:-3,  left:-6,  rot:-18, w:300, op:0.08 },
      { top:8,   left:50,  rot: 22, w:200, op:0.06 },
      { top:22,  left:-4,  rot: 10, w:160, op:0.05 },
      { top:36,  left:62,  rot:-28, w:260, op:0.07 },
      { top:50,  left:18,  rot: 35, w:220, op:0.06 },
      { top:63,  left:-5,  rot:-12, w:180, op:0.05 },
      { top:72,  left:55,  rot: 20, w:240, op:0.07 },
      { top:84,  left:28,  rot:-22, w:130, op:0.06 },
      { top:92,  left:60,  rot: 15, w:280, op:0.05 },
      { top:15,  left:30,  rot:-40, w:150, op:0.06 },
      { top:44,  left:-3,  rot: 28, w:320, op:0.04 },
      { top:78,  left:72,  rot:-16, w:190, op:0.06 },
      { top:5,   left:74,  rot: 12, w:170, op:0.05 },
      { top:30,  left:10,  rot:-20, w:210, op:0.06 },
      { top:55,  left:38,  rot: 42, w:140, op:0.05 },
      { top:68,  left:80,  rot:-30, w:250, op:0.06 },
    ];
    var frag = document.createDocumentFragment();
    logos.forEach(function (it) {
      var el = document.createElement('div');
      el.className = 's-logo';
      el.style.cssText = 'position:absolute;top:' + it.top + '%;left:' + it.left
        + '%;transform:rotate(' + it.rot + 'deg);opacity:' + it.op
        + ';width:' + it.w + 'px;';
      frag.appendChild(el);
    });
    document.getElementById('scatter').appendChild(frag);
  })();
  </script>

</body>
</html>
