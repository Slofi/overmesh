<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OverMesh — Login</title>
  <link rel="icon" type="image/png" href="/static/favicon.png?v=2">
  <style>
    :root {
      --accent: {{ accent_color }};
      --bg1: #0d0d0f;
      --bg2: #17181c;
      --bg3: #1e2025;
      --border: #2a2b30;
      --text: #e8e9ec;
      --muted: #6b6e7a;
      --red: #ef4444;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg1);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    #topo-layer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .scatter {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }
    .s-logo {
      position: absolute;
      background: var(--accent);
      -webkit-mask-image: url('/static/Overmesh_logo.png');
      mask-image: url('/static/Overmesh_logo.png');
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      aspect-ratio: 848 / 202;
    }
    .s-text {
      position: absolute;
      color: var(--accent);
      font-weight: 800;
      white-space: nowrap;
      letter-spacing: 0.04em;
      line-height: 1;
      user-select: none;
    }

    .login-wrap {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 340px;
      padding: 16px;
    }
    .login-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 36px 28px 28px;
    }
    .login-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }
    .login-logo-img {
      height: 22px;
      background: var(--accent);
      -webkit-mask-image: url('/static/Overmesh_logo.png');
      mask-image: url('/static/Overmesh_logo.png');
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      aspect-ratio: 848 / 202;
    }
    .login-sub {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 26px;
    }
    .login-field { margin-bottom: 14px; }
    .login-field label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .login-field input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
      padding: 9px 11px;
      outline: none;
      transition: border-color 0.15s;
    }
    .login-field input:focus { border-color: var(--accent); }
    .login-btn {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: opacity 0.15s;
    }
    .login-btn:hover  { opacity: 0.85; }
    .login-btn:active { opacity: 0.70; }
    .login-error {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.35);
      color: #f87171;
      border-radius: 6px;
      padding: 9px 11px;
      font-size: 13px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>

  <!--
    Topographic layer — loosely based on Ljubljana basin / surrounding hills.
    Elevation interval: 20 m. Index contours (every 100 m): 300, 400.
    Terrain rises toward upper-right (Golovec/Rožnik direction).
  -->
  <svg id="topo-layer" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice"
       xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Open contour lines, terrain rising toward upper-right -->
      <path id="c300"
        d="M -30,808 C 90,791 220,810 370,794
           C 520,778 660,798 820,781
           C 980,764 1120,783 1280,765
           C 1370,755 1430,758 1460,756"/>
      <path id="c320"
        d="M 10,694 C 140,676 285,696 440,678
           C 595,660 740,682 905,663
           C 1060,644 1200,666 1350,646
           C 1415,637 1448,639 1460,638"/>
      <path id="c340"
        d="M 60,580 C 200,561 355,583 510,562
           C 665,541 810,565 975,543
           C 1130,521 1270,546 1410,522
           C 1442,516 1456,518 1460,517"/>
      <path id="c360"
        d="M 130,468 C 280,447 440,470 600,447
           C 760,424 900,450 1060,425
           C 1205,401 1335,425 1430,405
           C 1450,401 1458,402 1460,402"/>
      <path id="c380"
        d="M 230,358 C 385,334 548,360 710,334
           C 872,308 1010,337 1160,308
           C 1290,283 1380,302 1435,291
           C 1452,287 1458,288 1460,288"/>
      <path id="c400"
        d="M 370,252 C 528,225 695,254 858,225
           C 1021,196 1155,228 1295,198
           C 1385,178 1430,185 1453,181"/>
      <path id="c420"
        d="M 540,155 C 690,126 845,157 1000,126
           C 1145,97 1275,124 1395,97
           C 1432,88 1452,90 1460,89"/>
      <path id="c440"
        d="M 740,66 C 878,40 1012,68 1148,40
           C 1270,15 1370,34 1444,16"/>

      <!-- Closed hilltop loops -->
      <!-- Castle Hill (Grajski grič) ~385 m — upper right cluster -->
      <path id="castle385"
        d="M 1078,322 C 1112,293 1168,286 1212,303
           C 1260,321 1270,363 1244,390
           C 1218,417 1164,420 1118,401
           C 1072,382 1058,349 1078,322 Z"/>
      <!-- Inner peak ~400 m -->
      <path id="castle400"
        d="M 1118,332 C 1142,315 1174,312 1200,325
           C 1228,338 1232,368 1212,386
           C 1192,404 1156,406 1128,391
           C 1100,376 1094,350 1118,332 Z"/>

      <!-- Rožnik hill ~390 m — upper left -->
      <path id="roznik390"
        d="M 165,248 C 202,218 262,211 308,229
           C 358,248 368,292 342,320
           C 316,348 260,353 208,333
           C 156,313 138,276 165,248 Z"/>
      <!-- Inner peak ~405 m -->
      <path id="roznik405"
        d="M 202,257 C 228,237 268,231 302,247
           C 338,263 344,298 322,320
           C 300,342 258,346 222,328
           C 186,310 178,277 202,257 Z"/>
    </defs>

    <!-- ── Regular contour lines (stroke-width 0.85) ── -->
    <g fill="none" stroke-linecap="round">
      <g stroke="#080809" stroke-width="0.85" opacity="0.9">
        <use href="#c320"/>
        <use href="#c340"/>
        <use href="#c360"/>
        <use href="#c380"/>
        <use href="#c420"/>
        <use href="#c440"/>
        <use href="#castle385"/>
        <use href="#roznik390"/>
      </g>
      <!-- Index contours 300 m and 400 m — thicker, slightly darker -->
      <g stroke="#060607" stroke-width="1.5" opacity="0.9">
        <use href="#c300"/>
        <use href="#c400"/>
      </g>
      <!-- Inner hilltop loops -->
      <g stroke="#080809" stroke-width="0.75" opacity="0.85">
        <use href="#castle400"/>
        <use href="#roznik405"/>
      </g>
    </g>

    <!--
      Elevation labels — paint-order:stroke trick gives bg-coloured halo
      that "breaks" the contour line behind the text, like a real topo map.
    -->
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
       font-size="9.5" font-weight="500"
       fill="#131315"
       stroke="#0d0d0f" stroke-width="5" paint-order="stroke"
       dominant-baseline="middle">

      <text><textPath href="#c300" startOffset="10%">300</textPath></text>
      <text><textPath href="#c300" startOffset="56%">300</textPath></text>

      <text><textPath href="#c320" startOffset="22%">320</textPath></text>
      <text><textPath href="#c320" startOffset="74%">320</textPath></text>

      <text><textPath href="#c340" startOffset="38%">340</textPath></text>

      <text><textPath href="#c360" startOffset="15%">360</textPath></text>
      <text><textPath href="#c360" startOffset="66%">360</textPath></text>

      <text><textPath href="#c380" startOffset="44%">380</textPath></text>

      <text><textPath href="#c400" startOffset="20%">400</textPath></text>
      <text><textPath href="#c400" startOffset="70%">400</textPath></text>

      <text><textPath href="#c420" startOffset="35%">420</textPath></text>

      <text><textPath href="#c440" startOffset="50%">440</textPath></text>

      <!-- Hilltop labels, centred inside the loops -->
      <text text-anchor="middle" x="1168" y="355">385</text>
      <text text-anchor="middle" x="1168" y="359" font-size="0"> </text><!-- spacer -->
      <text text-anchor="middle" x="256"  y="284">390</text>
    </g>
  </svg>

  <!-- Scattered OverMesh wordmarks -->
  <div class="scatter" id="scatter"></div>

  <div class="login-wrap">
    <div class="login-box">
      <div class="login-logo"><div class="login-logo-img"></div></div>
      <div class="login-sub">mesh network dashboard</div>
      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}
      <form method="POST" action="{{ base_path }}/login">
        <div class="login-field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" autofocus required>
        </div>
        <div class="login-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="login-btn">Sign in</button>
      </form>
    </div>
  </div>

  <script>
  (function () {
    var items = [
      { type:'logo', top:-3,  left:-6,  rot:-18, w:300, op:0.08 },
      { type:'logo', top:8,   left:50,  rot: 22, w:200, op:0.06 },
      { type:'logo', top:22,  left:-4,  rot: 10, w:160, op:0.05 },
      { type:'logo', top:36,  left:62,  rot:-28, w:260, op:0.07 },
      { type:'logo', top:50,  left:18,  rot: 35, w:220, op:0.06 },
      { type:'logo', top:63,  left:-5,  rot:-12, w:180, op:0.05 },
      { type:'logo', top:72,  left:55,  rot: 20, w:240, op:0.07 },
      { type:'logo', top:84,  left:28,  rot:-22, w:130, op:0.06 },
      { type:'logo', top:92,  left:60,  rot: 15, w:280, op:0.05 },
      { type:'logo', top:15,  left:30,  rot:-40, w:150, op:0.06 },
      { type:'logo', top:44,  left:-3,  rot: 28, w:320, op:0.04 },
      { type:'logo', top:78,  left:72,  rot:-16, w:190, op:0.06 },
      { type:'text', top:5,   left:68,  rot: 18, fs:60, op:0.06 },
      { type:'text', top:18,  left:7,   rot:-25, fs:36, op:0.07 },
      { type:'text', top:30,  left:42,  rot: 30, fs:48, op:0.05 },
      { type:'text', top:48,  left:72,  rot:-18, fs:28, op:0.07 },
      { type:'text', top:58,  left:5,   rot: 14, fs:54, op:0.06 },
      { type:'text', top:70,  left:38,  rot:-32, fs:40, op:0.05 },
      { type:'text', top:80,  left:70,  rot: 24, fs:32, op:0.07 },
      { type:'text', top:91,  left:8,   rot:-10, fs:46, op:0.06 },
      { type:'text', top:38,  left:20,  rot: 42, fs:24, op:0.05 },
      { type:'text', top:12,  left:82,  rot:-14, fs:52, op:0.06 },
    ];
    var frag = document.createDocumentFragment();
    items.forEach(function (it) {
      var el = document.createElement('div');
      el.style.cssText = 'position:absolute;top:' + it.top + '%;left:' + it.left
        + '%;transform:rotate(' + it.rot + 'deg);opacity:' + it.op + ';';
      if (it.type === 'logo') {
        el.className = 's-logo';
        el.style.width = it.w + 'px';
      } else {
        el.className = 's-text';
        el.style.fontSize = it.fs + 'px';
        el.textContent = 'OverMesh';
      }
      frag.appendChild(el);
    });
    document.getElementById('scatter').appendChild(frag);
  })();
  </script>

</body>
</html>
