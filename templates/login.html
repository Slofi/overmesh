<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OverMesh — Login</title>
  <link rel="icon" type="image/png" href="/static/favicon.png?v=2">
  <style>
    :root {
      --accent: {{ accent_color }};
      --bg1: #0d0d0f;
      --bg2: #17181c;
      --bg3: #1e2025;
      --border: #2a2b30;
      --text: #e8e9ec;
      --muted: #6b6e7a;
      --red: #ef4444;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg1);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    #topo-layer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .scatter {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }
    .s-logo {
      position: absolute;
      background: var(--accent);
      -webkit-mask-image: url('/static/Overmesh_logo.png');
      mask-image: url('/static/Overmesh_logo.png');
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      aspect-ratio: 848 / 202;
    }

    .login-wrap {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 340px;
      padding: 16px;
    }
    .login-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 36px 28px 28px;
    }
    .login-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }
    .login-logo-img {
      height: 22px;
      background: var(--accent);
      -webkit-mask-image: url('/static/Overmesh_logo.png');
      mask-image: url('/static/Overmesh_logo.png');
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      aspect-ratio: 848 / 202;
    }
    .login-sub {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 26px;
    }
    .login-field { margin-bottom: 14px; }
    .login-field label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .login-field input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
      padding: 9px 11px;
      outline: none;
      transition: border-color 0.15s;
    }
    .login-field input:focus { border-color: var(--accent); }
    .login-btn {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: opacity 0.15s;
    }
    .login-btn:hover  { opacity: 0.85; }
    .login-btn:active { opacity: 0.70; }
    .login-error {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.35);
      color: #f87171;
      border-radius: 6px;
      padding: 9px 11px;
      font-size: 13px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>

  <!--
    Topographic contour background — Ljubljana basin, geographically accurate.

    Viewport: 1440 × 900 px.
    Geographic bounds: 14.460–14.552 °E, 46.026–46.078 °N.
    Scale: ~200 px/km (x), ~155 px/km (y).

    Through-points derived from real terrain:
      Grajski grič (Castle Hill)  peak ≈ (757, 505)  375 m
      Rožnik / Cankarjev vrh      peak ≈ (255, 332)  394 m   (enters left edge)
      Šišenski hrib               peak ≈ (156, 225)  429 m   (enters left edge)
      Golovec / Mazovnik          peak ≈ (1361, 658) 450 m   (enters right edge)
      Ljubljana basin / Barje     floor ≈ 288–295 m          (open arcs, bottom)

    Paths are Catmull-Rom splines through terrain waypoints — not ellipses.
    Index contours (300, 400 m) drawn slightly thicker.
  -->
  <svg id="topo-layer" viewBox="0 0 1440 900"
       preserveAspectRatio="xMidYMid slice"
       xmlns="http://www.w3.org/2000/svg">
    <g id="topo-paths"></g>
  </svg>

  <!-- Scattered OverMesh logo wordmarks -->
  <div class="scatter" id="scatter"></div>

  <div class="login-wrap">
    <div class="login-box">
      <div class="login-logo"><div class="login-logo-img"></div></div>
      <div class="login-sub">mesh network dashboard</div>
      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}
      <form method="POST" action="{{ base_path }}/login">
        <div class="login-field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username"
                 autocomplete="username" autofocus required>
        </div>
        <div class="login-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password"
                 autocomplete="current-password" required>
        </div>
        <button type="submit" class="login-btn">Sign in</button>
      </form>
    </div>
  </div>

  <script>
  (function () {
    /* ── Catmull-Rom spline → cubic bezier SVG path ─────────────────────
       pts:    array of [x, y] through-points
       closed: true = closed loop (Z appended), false = open path
       Returns an SVG 'd' attribute string.
    ─────────────────────────────────────────────────────────────────── */
    function cr(pts, closed) {
      var n = pts.length;
      if (n < 2) return '';
      var d = 'M' + pts[0][0] + ',' + pts[0][1];
      for (var i = 0; i < (closed ? n : n - 1); i++) {
        var p0 = closed ? pts[(i - 1 + n) % n] : pts[Math.max(0, i - 1)];
        var p1 = pts[i];
        var p2 = pts[(i + 1) % n];
        var p3 = closed ? pts[(i + 2) % n] : pts[Math.min(n - 1, i + 2)];
        /* tension = 0.5 → control point offset = (next − prev) / 6 */
        var c1x = +(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1);
        var c1y = +(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1);
        var c2x = +(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1);
        var c2y = +(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1);
        d += ' C' + c1x + ',' + c1y + ' ' + c2x + ',' + c2y + ' ' + p2[0] + ',' + p2[1];
      }
      return closed ? d + ' Z' : d;
    }

    /* ── Terrain features ────────────────────────────────────────────────
       Each entry: { pts, closed, w (stroke-width), op (opacity) }
       Through-points are placed on real Ljubljana terrain.
    ─────────────────────────────────────────────────────────────────── */
    var FEATURES = [

      /* ════════════════════════════════════════════════════════════════
         GRAJSKI GRIČ  (Castle Hill)
         Compact, slightly elongated N→NE. Narrow spur toward Old Town
         to the north. Steep W and SW faces; gentler E slopes.
         Peak 375 m at ≈ (757, 505).  All paths closed.
         ════════════════════════════════════════════════════════════════ */

      /* 300 m — base, wide irregular loop */
      { pts: [
          [740, 398], [778, 384], [820, 378], [862, 386],
          [898, 405], [926, 434], [936, 468], [928, 504],
          [910, 538], [882, 564], [846, 582], [806, 588],
          [764, 582], [724, 564], [690, 536], [664, 498],
          [656, 458], [662, 420], [682, 394], [710, 382]
        ], closed: true, w: 1.3, op: 0.92 },

      /* 320 m */
      { pts: [
          [744, 416], [776, 404], [812, 399], [848, 406],
          [878, 422], [900, 448], [908, 480], [900, 512],
          [882, 540], [856, 558], [824, 566], [788, 562],
          [754, 548], [724, 526], [702, 497], [696, 464],
          [700, 434], [716, 414]
        ], closed: true, w: 0.85, op: 0.88 },

      /* 340 m */
      { pts: [
          [748, 434], [778, 424], [810, 420], [840, 427],
          [865, 442], [882, 466], [884, 494], [874, 520],
          [854, 541], [826, 553], [796, 556], [764, 548],
          [738, 530], [719, 504], [714, 474], [720, 448]
        ], closed: true, w: 0.85, op: 0.86 },

      /* 360 m */
      { pts: [
          [752, 452], [776, 443], [803, 440], [828, 447],
          [847, 462], [857, 485], [852, 510], [836, 528],
          [812, 537], [784, 536], [758, 524], [739, 502],
          [735, 476], [741, 454]
        ], closed: true, w: 0.85, op: 0.83 },

      /* 375 m — peak, small irregular blob */
      { pts: [
          [757, 470], [771, 466], [785, 468], [795, 478],
          [795, 493], [782, 502], [765, 503], [751, 493],
          [747, 478]
        ], closed: true, w: 0.75, op: 0.76 },


      /* ════════════════════════════════════════════════════════════════
         ROŽNIK / ŠIŠENSKI HRIB
         Large E-W forested ridge NW of city. Eastern slopes drop steeply
         into the city; W extends off-screen left.
         Rožnik / Cankarjev vrh 394 m ≈ (255, 332).
         Šišenski hrib 429 m ≈ (156, 225).
         300–340 m: single large loop partially off-screen left.
         360 m+: splits into two separate lobes.
         ════════════════════════════════════════════════════════════════ */

      /* 300 m — huge, W side off-screen */
      { pts: [
          [0, 258],  [62, 237],  [132, 228], [202, 230], [262, 238],

          [0, 494], [-160, 490], [-160, 262]
        ], closed: true, w: 1.3, op: 0.92 },

      /* 320 m */
      { pts: [
          [0, 275],  [58, 256],  [126, 248], [194, 250], [252, 259],
          [314, 275], [372, 296], [420, 327], [454, 364], [474, 404],
          [486, 442], [488, 478], [478, 510], [458, 535],
          [430, 553], [390, 560], [340, 558], [280, 546], [216, 530],
          [150, 512], [86, 496], [34, 486],
          [0, 480], [-140, 477], [-140, 278]
        ], closed: true, w: 0.85, op: 0.88 },

      /* 340 m */
      { pts: [
          [0, 292],  [54, 274],  [120, 268], [186, 270], [244, 280],
          [304, 297], [358, 318], [404, 348], [436, 382], [452, 418],
          [462, 454], [460, 486], [448, 514], [426, 534],
          [396, 546], [354, 548], [300, 536], [238, 520],
          [174, 504], [112, 488], [55, 476],
          [0, 470], [-120, 468], [-120, 295]
        ], closed: true, w: 0.85, op: 0.86 },

      /* 360 m — ROŽNIK LOBE (Cankarjev vrh / Rožnik peak area) */
      { pts: [
          [178, 318], [210, 307], [245, 303], [278, 308],
          [306, 322], [326, 344], [332, 370], [320, 394],
          [298, 408], [270, 412], [244, 404], [220, 386],
          [205, 360], [200, 336]
        ], closed: true, w: 0.85, op: 0.84 },

      /* 360 m — ŠIŠENSKI LOBE (separate peak to the NW) */
      { pts: [
          [88, 232],  [116, 220], [148, 216], [179, 220],
          [202, 234], [214, 255], [210, 278], [196, 291],
          [170, 296], [142, 291], [116, 276], [96, 256],
          [88, 242]
        ], closed: true, w: 0.85, op: 0.84 },

      /* 380 m — Rožnik lobe tightens */
      { pts: [
          [202, 323], [228, 313], [256, 309], [282, 315],
          [304, 330], [316, 352], [311, 376], [294, 390],
          [268, 395], [242, 386], [220, 368], [208, 342]
        ], closed: true, w: 0.85, op: 0.82 },

      /* 380 m — Šišenski lobe */
      { pts: [
          [104, 240],  [128, 230], [155, 227], [181, 232],
          [199, 248], [200, 268], [186, 281], [162, 285],
          [136, 279], [113, 263], [104, 248]
        ], closed: true, w: 0.85, op: 0.82 },

      /* 394 m — Rožnik / Cankarjev vrh peak */
      { pts: [
          [226, 328], [248, 319], [272, 317], [294, 325],
          [308, 342], [306, 362], [288, 374], [264, 375],
          [242, 364], [228, 345]
        ], closed: true, w: 0.78, op: 0.78 },

      /* 400 m — Šišenski sub-peak */
      { pts: [
          [116, 244],  [138, 236], [162, 235], [184, 243],
          [194, 258], [191, 274], [176, 282], [154, 282],
          [133, 272], [118, 257]
        ], closed: true, w: 0.78, op: 0.78 },

      /* 415 m — Šišenski near-peak */
      { pts: [
          [130, 248], [148, 242], [168, 242], [183, 251],
          [183, 265], [170, 273], [150, 273], [133, 262]
        ], closed: true, w: 0.72, op: 0.74 },

      /* 425 m — Šišenski peak (tiny blob) */
      { pts: [
          [142, 252], [154, 248], [165, 252], [167, 261],
          [159, 268], [147, 266], [140, 258]
        ], closed: true, w: 0.65, op: 0.68 },


      /* ════════════════════════════════════════════════════════════════
         GOLOVEC RIDGE
         Long E-W forested ridge SE of city. Multiple peaks:
         Mazovnik 450 m ≈ (1361, 658), Črni hrib 442 m ≈ (1450+, 622).
         Ridge enters screen from the right edge; western nose visible.
         Contours are closed loops that extend off-screen right.
         ════════════════════════════════════════════════════════════════ */

      /* 300 m — large elongated loop */
      { pts: [
          /* N face, entering right */
          [1500, 508], [1430, 504], [1352, 507], [1272, 514],
          [1192, 526], [1116, 542], [1050, 558], [990, 572],
          [940, 582], [904, 594],
          /* western nose */
          [876, 612], [862, 636], [867, 661], [886, 680],
          /* S face, going right */
          [916, 697], [964, 712], [1022, 720], [1086, 724],
          [1154, 723], [1228, 720], [1308, 718], [1388, 720],
          /* off-screen close */
          [1500, 720]
        ], closed: true, w: 1.3, op: 0.92 },

      /* 340 m */
      { pts: [
          [1500, 524], [1438, 520], [1364, 522], [1288, 530],
          [1212, 542], [1138, 556], [1072, 570], [1010, 582],
          [958, 591], [922, 602],
          [900, 620], [893, 644], [902, 667], [920, 684],
          [950, 697], [994, 708], [1048, 714], [1110, 717],
          [1176, 715], [1250, 712], [1332, 710], [1410, 712],
          [1500, 712]
        ], closed: true, w: 0.85, op: 0.88 },

      /* 380 m */
      { pts: [
          [1500, 542], [1445, 537], [1376, 538], [1304, 545],
          [1232, 555], [1162, 567], [1096, 579], [1040, 590],
          [990, 600], [954, 612],
          [932, 630], [928, 653], [940, 674], [960, 689],
          [992, 700], [1040, 708], [1098, 712], [1162, 710],
          [1236, 706], [1316, 704], [1400, 707],
          [1500, 707]
        ], closed: true, w: 0.85, op: 0.86 },

      /* 415 m — approaching peaks */
      { pts: [
          [1500, 564], [1452, 559], [1390, 558], [1325, 563],
          [1262, 572], [1202, 582], [1152, 592], [1112, 604],
          [1085, 622], [1082, 646], [1098, 666], [1128, 679],
          [1174, 686], [1230, 684], [1296, 681], [1368, 680],
          [1440, 678], [1500, 678]
        ], closed: true, w: 0.85, op: 0.84 },

      /* 440 m — near Mazovnik */
      { pts: [
          [1500, 590], [1462, 585], [1412, 583], [1364, 587],
          [1320, 595], [1284, 607], [1258, 624], [1254, 644],
          [1268, 662], [1298, 672], [1340, 675], [1388, 672],
          [1436, 666], [1500, 662]
        ], closed: true, w: 0.78, op: 0.80 },

      /* 450 m — Mazovnik peak (small section at right) */
      { pts: [
          [1500, 614], [1474, 609], [1440, 608], [1406, 613],
          [1380, 624], [1365, 641], [1368, 659], [1386, 668],
          [1416, 671], [1455, 666], [1492, 658], [1500, 655]
        ], closed: true, w: 0.72, op: 0.74 },


      /* ════════════════════════════════════════════════════════════════
         BASIN / BARJE  (Ljubljana Marsh)
         Nearly flat alluvial plain south of the city, ~288–295 m.
         Contours are nearly horizontal open arcs from edge to edge,
         gently dipping toward saddles between the hills.
         ════════════════════════════════════════════════════════════════ */

      /* 295 m */
      { pts: [
          [0, 762], [140, 754], [295, 750], [454, 752],
          [600, 754], [735, 751], [838, 748], [940, 752],
          [1075, 756], [1215, 754], [1375, 750], [1440, 748]
        ], closed: false, w: 0.75, op: 0.82 },

      /* 290 m */
      { pts: [
          [0, 826], [168, 818], [355, 814], [558, 816],
          [740, 818], [918, 816], [1098, 815], [1280, 813],
          [1440, 812]
        ], closed: false, w: 0.75, op: 0.80 },

      /* 285 m */
      { pts: [
          [0, 878], [198, 871], [426, 868], [664, 870],
          [898, 869], [1138, 868], [1358, 867], [1440, 866]
        ], closed: false, w: 0.75, op: 0.76 }

    ];

    /* ── Build SVG paths ──────────────────────────────────────────── */
    var g = document.getElementById('topo-paths');
    var NS = 'http://www.w3.org/2000/svg';
    FEATURES.forEach(function (f) {
      var el = document.createElementNS(NS, 'path');
      el.setAttribute('d', cr(f.pts, f.closed));
      el.setAttribute('fill', 'none');
      el.setAttribute('stroke', '#080809');
      el.setAttribute('stroke-width', String(f.w));
      el.setAttribute('opacity', String(f.op));
      el.setAttribute('stroke-linecap', 'round');
      el.setAttribute('stroke-linejoin', 'round');
      g.appendChild(el);
    });

    /* ── Spot elevation labels ────────────────────────────────────── */
    /* Minimal labels at hill peaks, same near-invisible style */
    var LABELS = [
      { x: 757, y: 498, t: '375' },
      { x: 255, y: 322, t: '394' },
      { x: 155, y: 216, t: '429' },
      { x: 296, y: 820, t: '290' }
    ];
    LABELS.forEach(function (lb) {
      var el = document.createElementNS(NS, 'text');
      el.setAttribute('x', lb.x);
      el.setAttribute('y', lb.y);
      el.setAttribute('text-anchor', 'middle');
      el.setAttribute('dominant-baseline', 'middle');
      el.setAttribute('font-family', '-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif');
      el.setAttribute('font-size', '8');
      el.setAttribute('font-weight', '400');
      el.setAttribute('fill', '#141416');
      el.setAttribute('stroke', '#0d0d0f');
      el.setAttribute('stroke-width', '4');
      el.setAttribute('paint-order', 'stroke');
      el.textContent = lb.t;
      g.appendChild(el);
    });

    /* ── Scattered logo wordmarks ─────────────────────────────────── */
    var logos = [
      { top:-3,  left:-6,  rot:-18, w:300, op:0.08 },
      { top:8,   left:50,  rot: 22, w:200, op:0.06 },
      { top:22,  left:-4,  rot: 10, w:160, op:0.05 },
      { top:36,  left:62,  rot:-28, w:260, op:0.07 },
      { top:50,  left:18,  rot: 35, w:220, op:0.06 },
      { top:63,  left:-5,  rot:-12, w:180, op:0.05 },
      { top:72,  left:55,  rot: 20, w:240, op:0.07 },
      { top:84,  left:28,  rot:-22, w:130, op:0.06 },
      { top:92,  left:60,  rot: 15, w:280, op:0.05 },
      { top:15,  left:30,  rot:-40, w:150, op:0.06 },
      { top:44,  left:-3,  rot: 28, w:320, op:0.04 },
      { top:78,  left:72,  rot:-16, w:190, op:0.06 },
      { top:5,   left:74,  rot: 12, w:170, op:0.05 },
      { top:30,  left:10,  rot:-20, w:210, op:0.06 },
      { top:55,  left:38,  rot: 42, w:140, op:0.05 },
      { top:68,  left:80,  rot:-30, w:250, op:0.06 }
    ];
    var frag = document.createDocumentFragment();
    logos.forEach(function (it) {
      var el = document.createElement('div');
      el.className = 's-logo';
      el.style.cssText = 'position:absolute;top:' + it.top + '%;left:' + it.left
        + '%;transform:rotate(' + it.rot + 'deg);opacity:' + it.op
        + ';width:' + it.w + 'px;';
      frag.appendChild(el);
    });
    document.getElementById('scatter').appendChild(frag);
  })();
  </script>

</body>
</html>
