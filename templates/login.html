<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OverMesh — Login</title>
  <link rel="icon" type="image/png" href="/static/favicon.png?v=2">
  <style>
    :root {
      --accent: {{ accent_color }};
      --bg1: #0d0d0f;
      --bg2: #17181c;
      --bg3: #1e2025;
      --border: #2a2b30;
      --text: #e8e9ec;
      --muted: #6b6e7a;
      --red: #ef4444;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg1);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .topo-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      background: var(--bg1);
      background-image: url('/static/login-topo-bg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .scatter {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }
    .s-logo {
      position: absolute;
      background: var(--accent);
      -webkit-mask-image: url('/static/Overmesh_logo.png');
      mask-image: url('/static/Overmesh_logo.png');
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      aspect-ratio: 848 / 202;
    }

    .login-wrap {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 340px;
      padding: 16px;
    }
    .login-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 36px 28px 28px;
    }
    .login-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }
    .login-logo-img {
      height: 22px;
      background: var(--accent);
      -webkit-mask-image: url('/static/Overmesh_logo.png');
      mask-image: url('/static/Overmesh_logo.png');
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      aspect-ratio: 848 / 202;
    }
    .login-sub {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 26px;
    }
    .login-field { margin-bottom: 14px; }
    .login-field label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .login-field input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
      padding: 9px 11px;
      outline: none;
      transition: border-color 0.15s;
    }
    .login-field input:focus { border-color: var(--accent); }
    .login-btn {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: opacity 0.15s;
    }
    .login-btn:hover  { opacity: 0.85; }
    .login-btn:active { opacity: 0.70; }
    .login-error {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.35);
      color: #f87171;
      border-radius: 6px;
      padding: 9px 11px;
      font-size: 13px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>

  <div class="topo-bg" aria-hidden="true"></div>

  <!-- Scattered OverMesh logo wordmarks -->
  <div class="scatter" id="scatter"></div>

  <div class="login-wrap">
    <div class="login-box">
      <div class="login-logo"><div class="login-logo-img"></div></div>
      <div class="login-sub">mesh network dashboard</div>
      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}
      <form method="POST" action="{{ base_path }}/login">
        <div class="login-field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username"
                 autocomplete="username" autofocus required>
        </div>
        <div class="login-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password"
                 autocomplete="current-password" required>
        </div>
        <button type="submit" class="login-btn">Sign in</button>
      </form>
    </div>
  </div>

  <script>
  (function () {
    /* ── Scattered logo wordmarks ─────────────────────────────────── */
    var logos = [
      { top:-3,  left:-6,  rot:-18, w:300, op:0.08 },
      { top:8,   left:50,  rot: 22, w:200, op:0.06 },
      { top:22,  left:-4,  rot: 10, w:160, op:0.05 },
      { top:36,  left:62,  rot:-28, w:260, op:0.07 },
      { top:50,  left:18,  rot: 35, w:220, op:0.06 },
      { top:63,  left:-5,  rot:-12, w:180, op:0.05 },
      { top:72,  left:55,  rot: 20, w:240, op:0.07 },
      { top:84,  left:28,  rot:-22, w:130, op:0.06 },
      { top:92,  left:60,  rot: 15, w:280, op:0.05 },
      { top:15,  left:30,  rot:-40, w:150, op:0.06 },
      { top:44,  left:-3,  rot: 28, w:320, op:0.04 },
      { top:78,  left:72,  rot:-16, w:190, op:0.06 },
      { top:5,   left:74,  rot: 12, w:170, op:0.05 },
      { top:30,  left:10,  rot:-20, w:210, op:0.06 },
      { top:55,  left:38,  rot: 42, w:140, op:0.05 },
      { top:68,  left:80,  rot:-30, w:250, op:0.06 }
    ];
    var frag = document.createDocumentFragment();
    logos.forEach(function (it) {
      var el = document.createElement('div');
      el.className = 's-logo';
      el.style.cssText = 'position:absolute;top:' + it.top + '%;left:' + it.left
        + '%;transform:rotate(' + it.rot + 'deg);opacity:' + it.op
        + ';width:' + it.w + 'px;';
      frag.appendChild(el);
    });
    document.getElementById('scatter').appendChild(frag);
  })();
  </script>

</body>
</html>
